[package]
name = "psi-okvs"
version = "0.2.0"

[lib]
name = "psi_okvs"
path = "src/lib.rs"

[dependencies]
psi-aes = { workspace = true }
sp-core = "26.0"
thiserror = "1.0"
aes-gcm = "0.10"
sha3 = "0.10.8"
rand = "0.8"
rayon = { version = "1.10", optional = true }
blake3 = "1.8.2"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[[bin]]
name = "test_rb_okvs_f2k"
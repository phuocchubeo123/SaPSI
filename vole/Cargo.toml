[package]
name = "psi-vole"
version = "0.1.0"

[lib]
name = "psi_vole"
path = "src/lib.rs"

[dependencies]
psi-okvs = { workspace = true }
psi-aes = { workspace = true }
lambdaworks-math = { git = "https://github.com/lambdaclass/lambdaworks.git", package = "lambdaworks-math" }
lambdaworks-crypto = { git = "https://github.com/lambdaclass/lambdaworks.git", package = "lambdaworks-crypto", features = ["parallel"], optional = true}
stark-platinum-prover = { git = "https://github.com/lambdaclass/lambdaworks.git", package = "stark-platinum-prover"}
rand = "0.8"
rand_chacha = "0.9.0"
tokio = { version = "1", features = ["full"] }
p256 = { version = "0.13.2", features = ["ecdh"] }
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.10", optional = true }
clap = "4.5.28"
libc = "0.2"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "dep:lambdaworks-crypto"]

[[bin]]
name = "ot"

[[bin]]
name = "cope"

[[bin]]
name = "test_field"

[[bin]]
name = "receiver_tcp"

[[bin]]
name = "sender_tcp"

[[bin]]
name = "base_svole"

[[bin]]
name = "test_mul"

[[bin]]
name = "test_block"

[[bin]]
name = "test_fri"

[[bin]]
name = "test_rayon"

[[bin]]
name = "test_fft"